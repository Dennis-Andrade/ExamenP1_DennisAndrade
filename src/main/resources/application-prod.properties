server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/edusmart_db
spring.datasource.username=edusmart_user
spring.datasource.password=edusmart_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo}
langchain4j.open-ai.chat-model.base-url=${OPENAI_BASE_URL:http://langchain4j.dev/demo/openai/v1}
langchain4j.open-ai.chat-model.model-name=${OPENAI_MODEL:gpt-4o-mini}
